<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/計算機.css">
</head>

<body>
    <div class="bear">
        <!-- 熊熊的耳朵 -->
        <div class="ear ear-left"></div>
        <div class="ear ear-right"></div>
        <!-- 熊熊的頭 -->
        <div class="head">
            <div class="eyes">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
            <div class="nose"></div>
            <!-- 計算機 -->
        </div>
        <div class="calculator">
            <!-- 螢幕 -->
            <div class="screen">0</div>
            <!-- 按鈕區 -->
            <div class="row">
                <button class="function">▶</button>
                <button class="function">AC</button>
                <button class="function">%</button>
                <button class="function">/</button>
            </div>

            <div class="row">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="function">x</button>
            </div>
            <div class="row">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="function">-</button>
            </div>
            <div class="bottom">
                <div class="bottom-left">
                    <div class="row">
                        <button>1</button>
                        <button>2</button>
                        <button>3</button>
                    </div>
                    <div class="row">
                        <button>0</button>
                        <button>.</button>
                        <button class="equal">=</button>
                    </div>
                </div>
                <button class="function plus">+</button>
            </div>
        </div>

    </div>
    <script>
        const screen = document.querySelector('.screen');
        const buttons = document.querySelectorAll('.calculator button');

        let input = '0';
        let firstNumber = null;
        let operate = '';
        let startNew = false;

        function calculate(a, b, symbol) {
            if (symbol === '+') return a + b;
            if (symbol === '-') return a - b;
            if (symbol === 'x') return a * b;

            if (symbol === '/') {
                if (b === 0) return NaN;
                return a / b;
            }

            if (symbol === '%') {
                if (b === 0) return NaN;
                return a % b;
            }
        }
        // 每個按鈕都加入點擊功能
        buttons.forEach(function (button) {
            button.addEventListener('click', function () {
                const value = button.textContent.trim();

                // AC：全部清除
                if (value === 'AC') {
                    input = '0';
                    firstNumber = null;
                    operator = '';
                    startNew = false;
                }

                // ▶：刪除最後一個數字
                else if (value === '▶') {
                    if (startNew || input === '錯誤') {
                        input = '0';
                    } else {
                        input = input.slice(0, -1);

                        if (input === '' || input === '-') {
                            input = '0';
                        }
                    }

                    startNew = false;
                }

                // 數字或小數點
                else if ('0123456789.'.includes(value)) {
                    if (startNew || input === '錯誤') {
                        input = '0';
                        startNew = false;
                    }

                    if (value === '.') {
                        // 同一個數字只能有一個小數點
                        if (!input.includes('.')) {
                            input += '.';
                        }
                    } else if (input === '0') {
                        input = value;
                    } else {
                        input += value;
                    }
                }

                // 加、減、乘、除、取餘數、等號
                else if (input !== '錯誤') {
                    const currentNumber = Number(input);

                    // 已有第一個數字和運算符號，就進行計算
                    if (operator !== '' && !startNew) {
                        const result = calculate(
                            firstNumber,
                            currentNumber,
                            operator
                        );

                        // 處理除以 0，以及小數運算誤差
                        if (Number.isFinite(result)) {
                            input = String(Number(result.toPrecision(12)));
                        } else {
                            input = '錯誤';
                        }
                    }

                    if (value === '=' || input === '錯誤') {
                        firstNumber = null;
                        operator = '';
                    } else {
                        firstNumber = Number(input);
                        operator = value;
                    }

                    startNew = true;
                }

                // 把目前的內容顯示在螢幕
                screen.textContent = input;
            });
        });

    </script>
</body>

</html>
